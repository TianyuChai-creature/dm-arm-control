# Station dual-arm config (only supported layout).
# physical order: left shoulder → end effector (0x00–0x04),
# right shoulder → end effector (0x05–0x09); motors list order is unchanged.
# classic CAN 1M. No root motors:/gravity: — use left:/right: only.
usb:
  serial: "52A871B1AA5EF4E239371A5083463F26"
  nominal_baud: 1000000
  data_baud: 1000000
  canfd: false
  brs: false
  device_index: 0

control:
  loop_period_ms: 1

left:
  gravity:
    enabled: true
    scale: 0.9
    use_measured_q: true
    coupled:
      basis:
        - one
        - sin_q0
        - sin_q1
        - sin_q2
        - sin_q3
        - sin_q4
