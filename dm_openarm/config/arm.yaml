# Station dual-arm config (only supported layout).
# physical order: left shoulder → end effector (0x00–0x04),
# right shoulder → end effector (0x05–0x09); motors list order is unchanged.
# classic CAN 1M. Gravity/dynamics are supplied by the upper layer.
usb:
  serial: "52A871B1AA5EF4E239371A5083463F26"
  nominal_baud: 1000000
  data_baud: 1000000
  canfd: false
  brs: false
  device_index: 0

left:
  motors:
    - name: L_end_effector
      model: DM4310
      mode: MIT
      can_id: 0x04
      mst_id: 0x14
    - name: L_wrist_2
      model: DM4310
      mode: MIT
      can_id: 0x02
      mst_id: 0x12
    - name: L_wrist_3
      model: DM4310
      mode: MIT
      can_id: 0x03
      mst_id: 0x13
    - name: L_elbow
      model: DM8009
      mode: MIT
      can_id: 0x01
      mst_id: 0x11
    - name: L_shoulder
      model: DM8009
      mode: MIT
      can_id: 0x00
      mst_id: 0x10

right:
  motors:
    - name: R_end_effector
      model: DM4310
      mode: MIT
      can_id: 0x09
      mst_id: 0x19
    - name: R_wrist_2
      model: DM4310
      mode: MIT
      can_id: 0x08
      mst_id: 0x18
    - name: R_wrist_3
      model: DM4310
      mode: MIT
      can_id: 0x07
      mst_id: 0x17
    - name: R_elbow
      model: DM8009
      mode: MIT
      can_id: 0x06
      mst_id: 0x16
    - name: R_shoulder
      model: DM8009
      mode: MIT
      can_id: 0x05
      mst_id: 0x15
